<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Генератор Контента</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #f8fafc; font-family: system-ui; }
    .header { background: linear-gradient(90deg, #4f46e5, #7c3aed); }
    .tab-active { background: #4f46e5; color: white; font-weight: 700; }
    .card { background: white; border: 2px solid #e0e7ff; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05); }
    video, img { border-radius: 16px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
    #debug { font-family: monospace; font-size: 0.85rem; }
  </style>
</head>
<body class="text-gray-900 min-h-screen pb-20">

  <!-- HEADER -->
  <div class="header text-white py-8 px-6 flex justify-between items-center">
    <h1 class="text-3xl font-bold tracking-tight">AI Генератор Контента</h1>
    <div class="flex items-center gap-4">
      <span id="current-user" class="bg-white/20 px-6 py-3 rounded-2xl text-lg"></span>
      <button onclick="logout()" class="bg-white/20 hover:bg-white/30 px-8 py-4 rounded-2xl text-lg transition">Выйти</button>
    </div>
  </div>

  <!-- ВКЛАДКИ -->
  <div class="flex flex-col gap-3 items-center mb-10 px-4">
    <button onclick="switchTab(0)" id="tab0" class="tab-active w-full max-w-xs px-10 py-5 text-2xl rounded-3xl">🎥 Видео из фото</button>
    <button onclick="switchTab(1)" id="tab1" class="w-full max-w-xs px-10 py-5 text-2xl rounded-3xl border-2 border-indigo-200">🖼️ Изображения из фото</button>
    <button onclick="switchTab(2)" id="tab2" class="w-full max-w-xs px-10 py-5 text-2xl rounded-3xl border-2 border-indigo-200">📝 Генерация из текста</button>
  </div>

  <!-- ВИДЕО -->
  <div id="section-video" class="card p-6 mx-4 rounded-3xl">
    <h2 class="text-3xl font-semibold mb-6 text-indigo-700">🎥 Видео из загруженного фото</h2>
    <div class="max-w-2xl mx-auto">
      <input type="file" id="video-image-upload" accept="image/*" class="block w-full border-2 border-dashed border-indigo-300 rounded-2xl p-6 text-center cursor-pointer mb-6">
      <textarea id="video-image-prompt" rows="4" class="w-full border-2 border-indigo-200 rounded-2xl p-6 text-lg" placeholder="Опишите желаемую анимацию..."></textarea>
      
      <div class="mt-6">
        <label class="block text-sm mb-2 text-gray-600">Длительность видео</label>
        <select id="duration" class="w-full border border-indigo-200 rounded-xl p-3">
          <option value="3" selected>3 секунды</option>
          <option value="6">6 секунд</option>
          <option value="10">10 секунд</option>
          <option value="15">15 секунд</option>
        </select>
      </div>

      <button onclick="generateVideo()" class="mt-10 w-full bg-indigo-600 hover:bg-indigo-700 text-white text-2xl font-semibold py-7 rounded-3xl transition">
        Создать видео
      </button>
    </div>

    <div id="video-result" class="mt-12 hidden">
      <div id="video-status" class="text-center text-xl mb-6 text-gray-700">Генерация видео...</div>
      <video id="video-player" controls class="w-full max-w-4xl mx-auto rounded-3xl"></video>
      <div class="flex gap-4 mt-6">
        <button onclick="downloadVideo()" class="flex-1 bg-indigo-600 text-white py-5 rounded-3xl">Скачать</button>
        <button onclick="stopVideoGeneration()" class="flex-1 bg-red-600 text-white py-5 rounded-3xl">Отмена</button>
      </div>
    </div>
  </div>

  <!-- ИЗОБРАЖЕНИЯ ИЗ ФОТО -->
  <div id="section-image" class="card p-6 mx-4 rounded-3xl hidden">
    <h2 class="text-3xl font-semibold mb-6 text-indigo-700">🖼️ Изображения из загруженного фото</h2>
    <div class="max-w-2xl mx-auto">
      <input type="file" id="main-edit-upload" accept="image/*" class="block w-full border-2 border-dashed border-indigo-300 rounded-2xl p-6 text-center cursor-pointer mb-6">
      <textarea id="edit-prompt" rows="4" class="w-full border-2 border-indigo-200 rounded-2xl p-6 text-lg" placeholder="Опишите желаемые изменения..."></textarea>
      <button onclick="editImage()" class="mt-8 w-full bg-indigo-600 hover:bg-indigo-700 text-white text-2xl font-semibold py-7 rounded-3xl transition">
        Сгенерировать 1 изображение
      </button>
    </div>

    <div id="image-result" class="mt-12 hidden text-center">
      <img id="variant1" class="max-w-2xl mx-auto rounded-3xl">
      <button onclick="downloadImage()" class="mt-6 bg-indigo-600 text-white px-12 py-5 rounded-3xl">Скачать изображение</button>
    </div>
  </div>

  <!-- ГЕНЕРАЦИЯ ИЗ ТЕКСТА -->
  <div id="section-text" class="card p-6 mx-4 rounded-3xl hidden">
    <h2 class="text-3xl font-semibold mb-6 text-indigo-700">📝 Генерация картинок из текста</h2>
    <div class="max-w-2xl mx-auto">
      <textarea id="text-prompt" rows="6" class="w-full border-2 border-indigo-200 rounded-2xl p-6 text-lg" placeholder="Опишите картинку..."></textarea>
      <button onclick="generateTextImages()" class="mt-8 w-full bg-indigo-600 hover:bg-indigo-700 text-white text-2xl font-semibold py-7 rounded-3xl transition">
        Сгенерировать 1 изображение
      </button>
    </div>

    <div id="text-result" class="mt-12 hidden">
      <div id="text-gallery" class="grid grid-cols-1 gap-6"></div>
    </div>
  </div>

  <!-- DEBUG -->
  <div class="mx-4 mt-8 card p-6 rounded-3xl">
    <h3 class="font-semibold text-lg mb-3 flex items-center gap-2">
      🧪 Debug Информация
      <button onclick="clearDebug()" class="ml-auto text-sm bg-gray-200 hover:bg-gray-300 px-4 py-1 rounded-xl">Очистить</button>
    </h3>
    <pre id="debug" class="bg-gray-900 text-green-400 p-4 rounded-2xl overflow-auto max-h-96 text-xs leading-relaxed"></pre>
  </div>

  <script>
    const API_BASE = "/api/proxy";
    let currentUser = null;
    let videoInterval = null;
    const debugLog = document.getElementById('debug');

    function logDebug(message, data = null) {
      const time = new Date().toLocaleTimeString('ru-RU');
      let entry = `[${time}] ${message}`;
      if (data) entry += '\n' + JSON.stringify(data, null, 2);
      debugLog.textContent = entry + '\n\n' + debugLog.textContent;
    }

    function clearDebug() { debugLog.textContent = ''; }

    function checkAuth() {
      currentUser = localStorage.getItem('currentUser');
      if (!currentUser) {
        window.location.href = 'index.html';
        return false;
      }
      document.getElementById('current-user').textContent = `👤 ${currentUser}`;
      return true;
    }

    function logout() {
      localStorage.removeItem('currentUser');
      window.location.href = 'index.html';
    }

    function switchTab(n) {
      document.querySelectorAll('[id^="section-"]').forEach(s => s.classList.add('hidden'));
      const sections = ['video','image','text'];
      document.getElementById('section-' + sections[n]).classList.remove('hidden');
      
      document.querySelectorAll('[id^="tab"]').forEach(t => t.classList.remove('tab-active'));
      document.getElementById('tab' + n).classList.add('tab-active');
    }

    async function apiFetch(endpoint, options = {}) {
      logDebug(`→ Запрос: ${endpoint}`);
      return fetch(API_BASE + endpoint, {
        method: options.method || 'GET',
        headers: { ...options.headers, 'Content-Type': 'application/json' },
        body: (options.method === 'POST' && options.body) ? options.body : undefined
      });
    }

    async function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function generateVideo() {
      const file = document.getElementById('video-image-upload').files[0];
      if (!file) return alert('Загрузите фото!');

      const statusEl = document.getElementById('video-status');
      const resultDiv = document.getElementById('video-result');
      resultDiv.classList.remove('hidden');
      statusEl.textContent = 'Подготовка...';

      try {
        const base64Image = await fileToBase64(file);
        const duration = currentUser === 'nysp' ? parseInt(document.getElementById('duration').value) : 8;

        const body = {
          model: "grok-imagine-video",
          prompt: document.getElementById('video-image-prompt').value || "Анимировать сцену",
          duration: duration,
          aspect_ratio: "9:16",
          resolution: "480p",
          image: { url: base64Image },
          seed: Math.floor(Math.random() * 2147483647)
        };

        logDebug("Отправка запроса на видео", body);

        const res = await apiFetch('/v1/videos/generations', { method: 'POST', body: JSON.stringify(body) });
        const data = await res.json();
        logDebug("Ответ сервера", data);

        if (!res.ok || (data.error && data.error.toLowerCase().includes('moderation'))) {
          statusEl.innerHTML = `<span class="text-red-600">Контент не прошёл модерацию</span>`;
          return;
        }

        const requestId = data.request_id || data.id;
        if (!requestId) return statusEl.textContent = 'Ошибка: нет request_id';

        videoInterval = setInterval(async () => {
          try {
            const statusRes = await apiFetch(`/v1/videos/${requestId}`);
            const statusData = await statusRes.json();
            logDebug("Статус", statusData);

            const progress = statusData.progress || 0;
            statusEl.innerHTML = `Генерация... <span class="font-mono">${progress}%</span>`;

            if (statusData.status === 'done') {
              clearInterval(videoInterval);
              let videoUrl = statusData.video?.url || statusData.url;
              if (videoUrl) {
                statusEl.textContent = 'Готово! Загрузка...';
                await loadVideoWithProxyFallback(videoUrl);
              }
            } else if (statusData.status === 'failed' || statusData.error) {
              clearInterval(videoInterval);
              statusEl.innerHTML = `<span class="text-red-600">Ошибка: ${statusData.error || 'Неизвестная'}</span>`;
            }
          } catch (e) { logDebug("Polling error", e.message); }
        }, 3500);

      } catch (e) {
        logDebug("ОШИБКА generateVideo", e.message);
        statusEl.textContent = 'Ошибка генерации';
      }
    }

    async function loadVideoWithProxyFallback(originalUrl) {
      const player = document.getElementById('video-player');
      const statusEl = document.getElementById('video-status');

      player.src = originalUrl;
      player.load();

      player.onerror = () => {
        logDebug("Прямая загрузка не удалась, используем прокси");
        const proxiedUrl = `${API_BASE}/video?url=${encodeURIComponent(originalUrl)}`;
        player.src = proxiedUrl;
        player.load();
      };

      player.onloadedmetadata = () => statusEl.textContent = '✅ Видео готово!';
    }

    function stopVideoGeneration() {
      if (videoInterval) clearInterval(videoInterval);
      document.getElementById('video-status').textContent = 'Остановлено';
    }

    function downloadVideo() {
      const player = document.getElementById('video-player');
      if (player.src) {
        const a = document.createElement('a');
        a.href = player.src;
        a.download = `video-${Date.now()}.mp4`;
        a.click();
      }
    }

    async function editImage() {
      const file = document.getElementById('main-edit-upload').files[0];
      if (!file) return alert('Загрузите фото');

      const prompt = document.getElementById('edit-prompt').value || "Улучшить";
      const resultDiv = document.getElementById('image-result');
      resultDiv.classList.add('hidden');

      try {
        const base64 = await fileToBase64(file);
        const res = await apiFetch('/v1/images/edits', {
          method: 'POST',
          body: JSON.stringify({
            model: "grok-imagine-image",
            prompt,
            image: { url: base64 },
            n: 1,
            response_format: "b64_json"
          })
        });
        const data = await res.json();
        logDebug("editImage ответ", data);

        if (data.data && data.data[0]) {
          const src = `data:image/jpeg;base64,${data.data[0].b64_json}`;
          let img = document.getElementById('variant1');
          if (!img) {
            img = document.createElement('img');
            img.id = 'variant1';
            img.className = 'max-w-2xl mx-auto rounded-3xl';
            resultDiv.innerHTML = '';
            resultDiv.appendChild(img);
            
            const btn = document.createElement('button');
            btn.onclick = downloadImage;
            btn.className = 'mt-6 bg-indigo-600 text-white px-12 py-5 rounded-3xl';
            btn.textContent = 'Скачать изображение';
            resultDiv.appendChild(btn);
          }
          img.src = src;
          resultDiv.classList.remove('hidden');
        }
      } catch (e) {
        logDebug("ОШИБКА editImage", e.message);
      }
    }

    function downloadImage() {
      const img = document.getElementById('variant1');
      if (img && img.src) {
        const a = document.createElement('a');
        a.href = img.src;
        a.download = `image-${Date.now()}.jpg`;
        a.click();
      }
    }

    async function generateTextImages() {
      const prompt = document.getElementById('text-prompt').value.trim();
      if (!prompt) return alert('Введите описание');

      const gallery = document.getElementById('text-gallery');
      gallery.innerHTML = '';
      document.getElementById('text-result').classList.remove('hidden');

      try {
        const res = await apiFetch('/v1/images/generations', {
          method: 'POST',
          body: JSON.stringify({
            model: "grok-imagine-image",
            prompt,
            n: 1,
            response_format: "b64_json"
          })
        });
        const data = await res.json();
        if (data.data && data.data[0]) {
          const src = `data:image/jpeg;base64,${data.data[0].b64_json}`;
          gallery.innerHTML = `<img src="${src}" class="w-full max-w-2xl mx-auto rounded-3xl">`;
        }
      } catch (e) {
        logDebug("ОШИБКА generateTextImages", e.message);
      }
    }

    // Инициализация
    if (checkAuth()) {
      switchTab(0);
      logDebug("Страница успешно загружена");
    }
  </script>
</body>
</html>
