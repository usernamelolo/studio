<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои видео</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #f8fafc; font-family: system-ui; }
    .video-card { transition: all 0.2s; }
    .video-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
  </style>
</head>
<body class="min-h-screen pb-20">

  <div class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-8 px-6">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-4xl font-bold">📼 Мои видео</h1>
      <button onclick="window.location.href='generation.html'" 
              class="bg-white text-indigo-700 px-8 py-4 rounded-3xl font-semibold hover:bg-gray-100">
        ← Назад к генерации
      </button>
    </div>
  </div>

  <div class="max-w-6xl mx-auto px-4 mt-8">
    <button onclick="clearHistory()" 
            class="mb-6 px-6 py-3 bg-red-100 hover:bg-red-200 text-red-700 rounded-2xl text-sm">
      Очистить всю историю
    </button>

    <div id="video-list" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>

    <div id="empty-state" class="hidden text-center py-24">
      <div class="text-7xl mb-6">📭</div>
      <p class="text-2xl text-gray-500">Пока нет сохранённых видео</p>
    </div>
  </div>

  <script>
    function loadVideoHistory() {
      const history = JSON.parse(localStorage.getItem('videoHistory') || '[]');
      const container = document.getElementById('video-list');
      const empty = document.getElementById('empty-state');
      
      container.innerHTML = '';

      if (history.length === 0) {
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');

      history.forEach(item => {
        const card = document.createElement('div');
        card.className = "video-card bg-white rounded-3xl overflow-hidden shadow-lg";
        card.innerHTML = `
          <div class="p-4 bg-gray-50">
            <video controls class="w-full rounded-2xl" preload="metadata">
              <source src="${item.url}" type="video/mp4">
            </video>
          </div>
          <div class="p-6">
            <p class="text-xs text-gray-500">${item.date}</p>
            <p class="mt-3 text-gray-700 line-clamp-3">${item.prompt}</p>
            <div class="mt-6 flex gap-4">
              <a href="${item.url}" target="_blank" class="flex-1 text-center bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-2xl font-medium">Открыть</a>
              <button onclick="downloadVideo('${item.url}')" class="flex-1 bg-gray-800 hover:bg-gray-900 text-white py-4 rounded-2xl font-medium">Скачать</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function downloadVideo(url) {
      const a = document.createElement('a');
      a.href = url;
      a.download = `video-${Date.now()}.mp4`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function clearHistory() {
      if (confirm('Удалить всю историю видео?')) {
        localStorage.removeItem('videoHistory');
        loadVideoHistory();
      }
    }

    // Загрузка при открытии
    loadVideoHistory();
  </script>
</body>
</html>
